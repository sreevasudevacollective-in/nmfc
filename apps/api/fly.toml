# Mumbai, to co-locate with Supabase ap-south-1 (see docs/decisions/0001-cloud-platform.md).
app = "nmfc-api"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

# Migrations run here, before the new version takes traffic — never at app boot.
[deploy]
  release_command = "npx prisma migrate deploy"

[env]
  PORT = "4000"
  NODE_ENV = "production"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Keep one machine warm. Scaling to zero adds a cold start to the first
  # request after idle, which is the wrong trade for a public site.
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
