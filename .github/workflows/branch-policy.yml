name: Branch policy

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  enforce:
    name: Enforce branching strategy
    runs-on: ubuntu-latest
    steps:
      - name: Validate base and head branches
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          # Work lands on develop. main stays production-clean: only develop may merge into it.
          if [ "$BASE" = "main" ]; then
            if [ "$HEAD" != "develop" ]; then
              echo "::error::main only accepts pull requests from develop (got '${HEAD}'). Open work PRs against develop."
              exit 1
            fi
            echo "OK: develop → main (release)"
            exit 0
          fi

          if [ "$BASE" != "develop" ]; then
            echo "::error::Pull requests must target develop (got '${BASE}'). main is release-only."
            exit 1
          fi

          if ! printf '%s\n' "$HEAD" | grep -Eq '^(feature|fix|chore|hotfix)/[a-z0-9][a-z0-9._-]*$'; then
            echo "::error::Branch '${HEAD}' must match feature|fix|chore|hotfix/<short-name> (lowercase kebab-case)."
            echo "Allowed examples: feature/fighter-profile, fix/rankings-sort, chore/prisma-migrate, hotfix/cors"
            exit 1
          fi

          echo "OK: ${HEAD} → develop"
